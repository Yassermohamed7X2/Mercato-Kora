<style>

.ps *{animation:none!important;transition:none!important;text-shadow:none!important}

<script>
/* ===== إعدادات Firebase (اختياري: للدخول بجوجل/فيسبوك/إيميل حقيقي) — املأها من لوحة Firebase ===== */
const FB={apiKey:"",authDomain:"",projectId:"",appId:""};
const B="https://www.gstatic.com/firebasejs/10.12.2/";

/* ===== البيانات ===== */
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const G={'حراسة':'G','قلب دفاع':'D','ظهير أيمن':'D','ظهير أيسر':'D','وسط مدافع':'M','وسط':'M','صانع ألعاب':'M','جناح أيمن':'M','جناح أيسر':'M','مهاجم':'F'};
const FM={'4-4-2':[4,4,2],'4-3-3':[4,3,3],'4-2-3-1':[4,5,1],'3-5-2':[3,5,2],'5-3-2':[5,3,2]};
const LG={
eg:{n:'الدوري المصري الممتاز',c:[['AHL','الأهلي',79,45,'#c8102e'],['ZAM','الزمالك',76,26,'#e0364c'],['PYR','بيراميدز',77,44,'#1d4ba0'],['MAS','المصري البورسعيدي',71,12,'#0a7a3c'],['ISM','الإسماعيلي',69,8,'#e6b800'],['SMO','سموحة',68,8,'#0e8a8a'],['ITH','الاتحاد السكندري',66,6,'#14804a'],['MOD','مودرن سبورت',65,6,'#2a3a9a'],['CER','سيراميكا كليوباترا',65,6,'#d9531e'],['GOU','الجونة',62,4,'#1a8ab0'],['ENP','إنبي',63,4,'#0b47a0'],['TAL','طلائع الجيش',60,3,'#2f7a4a']]},
eu:{n:'دوري النخبة الأوروبي',c:[['RMA','ريال مدريد',90,200,'#bbb'],['MCI','مانشستر سيتي',91,220,'#6cb4e4'],['LIV','ليفربول',88,180,'#d00'],['BAY','بايرن ميونخ',89,190,'#d00'],['INT','إنتر ميلان',86,150,'#0a3a8a'],['BAR','برشلونة',87,160,'#a50044']]}};
const ZSQ="كيليان مباني|34|مهاجم|87|19,أنطونيو روديجر|30|قلب دفاع|86|42,خالد جاد|29|قلب دفاع|79|28,حسن سعيد|27|قلب دفاع|79|37,إبراهيم الدسوقي|28|ظهير أيسر|78|35,طه كمال|29|وسط مدافع|78|26,ناصر ماهر|26|وسط|78|38,شيكو بانزا|26|جناح أيمن|78|38,محمد عواد|29|حراسة|77|25,عمر جابر|25|ظهير أيمن|77|36,عدي الدباغ|30|مهاجم|77|25,محمد صبحي|25|حراسة|77|36,عمرو فؤاد|33|قلب دفاع|75|8.9,عبد الله السعيد|32|صانع ألعاب|75|15,إبراهيم فؤاد|18|مهاجم|75|39,علي فؤاد|34|وسط مدافع|74|6,سيف الدين الجزيري|33|مهاجم|73|5,أحمد مصطفى|33|جناح أيسر|71|4";
const STARS="تياجو روميرو|23|حراسة|99|149|ريال مدريد,ليام شتاينر|23|حراسة|99|149|مانشستر سيتي,ليام ميخائيل|21|قلب دفاع|99|149|مانشستر سيتي,ماركوس لوكومي|27|وسط مدافع|96|104|ريال مدريد,لوكاس موريتي|25|قلب دفاع|96|115|مانشستر سيتي,لوران أوليفيرا|21|قلب دفاع|96|131|ليفربول,مانويل بيريرا|24|ظهير أيمن|96|115|ليفربول,ليام دا سيلفا|21|وسط مدافع|96|131|بايرن ميونخ,إريك بيريرا|22|قلب دفاع|96|131|إنتر ميلان,ماتيو روميرو|28|قلب دفاع|95|100|ريال مدريد,سيمون بيدرو|26|ظهير أيمن|95|110|مانشستر سيتي,رافاييل بيريرا|26|قلب دفاع|94|105|برشلونة";
const FN=['أحمد','محمد','محمود','عمر','يوسف','كريم','مصطفى','طارق','حسام','وليد','إسلام','زياد'],LN=['حسن','سالم','عادل','فتحي','رشاد','منصور','نبيل','صلاح','جمال','شريف','ماهر','سمير'];
const POS=['حراسة','حراسة','قلب دفاع','قلب دفاع','قلب دفاع','قلب دفاع','ظهير أيمن','ظهير أيسر','وسط مدافع','وسط مدافع','وسط','وسط','وسط','صانع ألعاب','جناح أيمن','جناح أيسر','مهاجم','مهاجم','مهاجم'];
let uid=1;const val=r=>Math.max(1,Math.round((r-55)**2/9));
const mk=(n,a,p,r,v,cl)=>({id:uid++,n,a:+a,p,r:+r,v:v==null?val(r):+v,cl});
const gen=s=>POS.map((p,i)=>mk(pick(FN)+' '+pick(LN),R(19,34),p,Math.max(55,s+R(-6,6)-(i>11?3:0))));
const parse=(t,f)=>t.split(',').map(x=>{const a=x.split('|');return mk(a[0],a[1],a[2],a[3],a[4],f?a[5]:null)});

/* ===== الحالة ===== */
let S=null,U=null,tab='home',lg='eg',selC=null,flt='G0',q='',mf='G0',mq='';
const save=()=>U&&S&&localStorage.setItem('mk_s3_'+U+'_'+SL,JSON.stringify(S));
const pl=id=>S.sq.find(p=>p.id==id),f1=n=>Math.round(n*10)/10;
const cls=r=>r>=85?'a':r>=78?'b':'';
const teamStr=()=>S.xi.length?Math.round(S.xi.reduce((s,i)=>s+pl(i).r,0)/S.xi.length):0;
function sched(n){let t=[...Array(n).keys()],rs=[];for(let r=0;r<n-1;r++){let m=[];for(let i=0;i<n/2;i++){let a=t[i],b=t[n-1-i];m.push(r%2?[b,a]:[a,b])}rs.push(m);t.splice(1,0,t.pop())}return rs.concat(rs.map(r=>r.map(([a,b])=>[b,a])))}
function auto(){const f=FM[S.fm],need={G:1,D:f[0],M:f[1],F:f[2]},xi=[];['G','D','M','F'].forEach(g=>S.sq.filter(p=>G[p.p]==g).sort((a,b)=>b.r-a.r).slice(0,need[g]).forEach(p=>xi.push(p.id)));S.sq.slice().sort((a,b)=>b.r-a.r).forEach(p=>{if(xi.length<11&&!xi.includes(p.id))xi.push(p.id)});S.xi=xi}
function newGame(){const L=LG[lg].c,cl=L.map(c=>({k:c[0],n:c[1],s:c[2],c:c[4]}));
 const sq=REAL[cl[selC].k]?parse(REAL[cl[selC].k]):gen(cl[selC].s);
 const mkt=[];cl.forEach((c,i)=>{if(i!=selC)(REAL[c.k]?parse(REAL[c.k]):gen(c.s)).sort((a,b)=>b.r-a.r).slice(0,5).forEach(p=>{p.cl=c.n;mkt.push(p)})});
 S={lg,ci:selC,cl,sq,b:L[selC][3],se:1,rd:0,fm:'4-4-2',sc:sched(cl.length),tb:cl.map(()=>({w:0,d:0,l:0,gf:0,ga:0})),mk:mkt,res:[],nw:['أهلاً بك مدرباً جديداً! الميزانية الحالية '+L[selC][3]+' مليون.'],gl:{},sg:{}};cupInit();auto();save();render()}
const pts=i=>S.tb[i].w*3+S.tb[i].d,pd=i=>S.tb[i].w+S.tb[i].d+S.tb[i].l;
const ord=()=>S.cl.map((c,i)=>i).sort((a,b)=>pts(b)-pts(a)||(S.tb[b].gf-S.tb[b].ga)-(S.tb[a].gf-S.tb[a].ga)||S.tb[b].gf-S.tb[a].gf||a-b);
const po=l=>{l=Math.max(.2,l);const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};
function upd(i,g,c){const t=S.tb[i];t.gf+=g;t.ga+=c;g>c?t.w++:g<c?t.l++:t.d++}
function play(){const me=S.ci;let out;
 S.sc[S.rd].forEach(([h,a])=>{const sh=h==me?teamStr():S.cl[h].s,sa=a==me?teamStr():S.cl[a].s,gh=po(1.4+(sh-sa)*.05),ga=po(1.1+(sa-sh)*.05);upd(h,gh,ga);upd(a,ga,gh);
  if(h==me||a==me){out={h,a,gh,ga};const n=h==me?gh:ga,pool=[];S.xi.forEach(id=>{const p=pl(id),w={G:0,D:1,M:2,F:5}[G[p.p]];for(let i=0;i<w;i++)pool.push(p)});for(let i=0;i<n;i++){const s=pick(pool);S.gl[s.n]=(S.gl[s.n]||0)+1}}});
 const my=out.h==me?[out.gh,out.ga]:[out.ga,out.gh];S.res.unshift({r:S.rd+1,t:`${S.cl[out.h].n} ${out.gh} - ${out.ga} ${S.cl[out.a].n}`,o:my[0]>my[1]?'ف':my[0]<my[1]?'خ':'ت'});
 S.rd++;S.b=f1(S.b+2);S.nw.unshift(`الجولة ${S.rd}: ${S.res[0].t}`);save();
 modal(`<h2>${S.res[0].t}</h2><p class=mu style="margin:10px 0">${my[0]>my[1]?'فوز! 🎉':my[0]<my[1]?'خسارة 😔':'تعادل'}</p>`+(S.rd>=S.sc.length?'<p>انتهى الموسم!</p>':'')+'<button class=pri onclick=cm()>تمام</button>')}
function nextSeason(){const rk=ord().indexOf(S.ci)+1;S.b=f1(S.b+10+(S.cl.length-rk)*3);S.se++;S.rd=0;S.tb=S.cl.map(()=>({w:0,d:0,l:0,gf:0,ga:0}));S.gl={};S.sg={};cupInit();S.res=[];S.sq.forEach(p=>{p.a++;p.r=Math.min(99,Math.max(50,p.r+(p.a<=24?R(0,2):p.a>=31?-R(0,2):R(-1,1))))});S.nw.unshift(`انطلاق الموسم ${S.se}! الميزانية الحالية ${S.b} مليون.`);auto();save();render()}
function buy(i){const m=S.mk[i];if(S.b<m.v)return alert('الميزانية لا تكفي');if(S.sq.length>=25)return alert('القائمة ممتلئة (25 لاعب)');S.b=f1(S.b-m.v);S.mk.splice(i,1);S.sq.push(m);S.nw.unshift(`صفقة جديدة! ${m.n} انتقل من ${m.cl||'أحد الأندية'} مقابل ${m.v} مليون.`);auto();save();render()}
function sell(id){if(S.sq.length<=14)return alert('لازم تحتفظ بـ14 لاعب على الأقل');const p=pl(id),pr=f1(p.v*.8);if(!confirm(`بيع ${p.n} مقابل ${pr} مليون؟`))return;S.sq=S.sq.filter(x=>x.id!=id);S.b=f1(S.b+pr);p.cl='فريقك السابق';S.mk.push(p);if(S.xi.includes(id))auto();save();render()}
function sw(id){if(!S.pk)S.pk=id;else if(S.pk==id)S.pk=null;else{const a=S.xi.indexOf(S.pk),b=S.xi.indexOf(id);if(a>=0&&b>=0)[S.xi[a],S.xi[b]]=[S.xi[b],S.xi[a]];else if(a>=0)S.xi[a]=id;else if(b>=0)S.xi[b]=S.pk;S.pk=null;save()}render()}

/* ===== الدخول ===== */
let FBA=null;
async function fbInit(){if(!FB.apiKey)return null;if(FBA)return FBA;const m=await import(B+'firebase-app.js'),a=await import(B+'firebase-auth.js');FBA={a,au:a.getAuth(m.initializeApp(FB))};return FBA}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function social(k){const f=await fbInit();if(!f)return alert('الدخول بجوجل/فيسبوك محتاج إعداد Firebase: املأ FB في أول السكربت.');try{const r=await f.a.signInWithPopup(f.au,k=='g'?new f.a.GoogleAuthProvider():new f.a.FacebookAuthProvider());enter(r.user.uid)}catch(e){alert(e.message)}}
async function mail(reg){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;if(!e||p.length<6)return alert('اكتب إيميل وكلمة سر 6 أحرف على الأقل');const f=await fbInit();
 if(f){try{const r=await(reg?f.a.createUserWithEmailAndPassword:f.a.signInWithEmailAndPassword)(f.au,e,p);return enter(r.user.uid)}catch(x){return alert(x.message)}}
 const us=JSON.parse(localStorage.mk_u||'{}'),h=await sha(p);if(reg){if(us[e])return alert('الإيميل مسجل قبل كده');us[e]=h;localStorage.mk_u=JSON.stringify(us)}else if(us[e]!=h)return alert('الإيميل أو كلمة السر غلط');enter('l_'+e)}
function enter(id){U=id;localStorage.mk_cur=id;S=JSON.parse(localStorage.getItem('mk_s2_'+id)||'null');if(S){uid=Math.max(...S.sq.concat(S.mk).map(p=>p.id))+1}tab='home';render()}
function out(){localStorage.removeItem('mk_cur');U=S=null;render()}

const REAL={

 const paint=fin=>{$('#ls').textContent=sh+' - '+sa;$('#lm').textContent=fin?'FT':m+"'";$('#lf').innerHTML=fd.slice().reverse().map(x=>`<p class=row style="padding:6px 2px">${x}</p>`).join('');if(fin)$('#lb').innerHTML=(ex?`<p style="margin-bottom:10px">${ex}</p>`:'')+`<button class=pri onclick=cm()>تمام</button>`};

function cupInit(){const n=S.cl.length;let k=n,N=0;while(k>1){k=Math.ceil(k/2);N++}const T=S.sc.length;S.cp={al:[...Array(n).keys()],st:0,N,at:Array.from({length:N},(_,i)=>Math.round(T*(i+1)/(N+1))),dr:null,log:[],w:null}}

function cupDraw(){const c=S.cp;if(!c.dr){const a=c.al.slice().sort(()=>Math.random()-.5),bye=a.length%2?a.pop():null,pr=[];for(let i=0;i<a.length;i+=2)pr.push([a[i],a[i+1]]);c.dr={pr,bye}}return c.dr}
function duel(a,b){const sa=a==S.ci?teamStr():S.cl[a].s,sb=b==S.ci?teamStr():S.cl[b].s,gh=po(1.3+(sa-sb)*.05),ga=po(1.1+(sb-sa)*.05);return{gh,ga,pen:gh==ga,w:gh>ga?a:ga>gh?b:(Math.random()<.5+(sa-sb)*.01?a:b)}}
function cupFin(uw){const c=S.cp,d=c.dr,nx=d.bye==null?[]:[d.bye];d.pr.forEach(([a,b])=>{if(a==S.ci||b==S.ci)nx.push(uw);else nx.push(duel(a,b).w)});c.al=nx;c.st++;c.dr=null;
 if(nx.length==1){c.w=nx[0];S.nw.unshift(`🏆 ${LG[S.lg].cup}: ${S.cl[c.w].n} بطل الكأس!`);if(c.w==S.ci)S.b=f1(S.b+15)}}
function cupAuto(){if(!S||!S.cp)return;while(cupDue()){if(cupDraw().pr.some(p=>p.includes(S.ci)))break;cupFin()}}
function cupGo(){const d=cupDraw(),[a,b]=d.pr.find(p=>p.includes(S.ci)),r=duel(a,b),e=evs(a,b,r.gh,r.ga),lb=cupLbl(),cn=LG[S.lg].cup,
 t=`${S.cl[a].n} ${r.gh} - ${r.ga} ${S.cl[b].n}`+(r.pen?` (ركلات الترجيح: ${S.cl[r.w].n})`:'');
